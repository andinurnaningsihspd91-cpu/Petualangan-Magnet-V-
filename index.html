<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Petualangan Menjumlahkan Pecahan - Kelas V</title>
<style>
:root{--navy:#164e63;--teal:#0d9488;--ink:#17324d;--muted:#64748b}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#e0f2fe,#f0fdfa 55%,#fff7ed);color:var(--ink);min-height:100vh}header{background:var(--navy);color:white;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:12px}.logo{font-size:32px;background:#fff;color:var(--navy);border-radius:14px;padding:7px}.brand h1{font-size:clamp(18px,3vw,25px);margin:0}.brand p{margin:4px 0 0;color:#cffafe;font-size:13px}nav,.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}button{border:0;border-radius:12px;padding:11px 15px;font-weight:700;cursor:pointer;background:#fff;color:var(--navy);box-shadow:0 2px 0 #cbd5e1}button:hover{filter:brightness(.97)}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:var(--teal);color:white;box-shadow:0 2px 0 #0f766e}.secondary{background:#e0f2fe}main{max-width:1050px;margin:24px auto;padding:0 16px 35px}.panel{background:#ffffffed;border:1px solid #dbeafe;border-radius:22px;padding:clamp(18px,4vw,32px);box-shadow:0 10px 30px #164e6310}.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:25px;align-items:center}.hero h2{font-size:clamp(28px,5vw,44px);line-height:1.08;margin:8px 0 14px;color:var(--navy)}.hero p{font-size:18px;line-height:1.55;color:#475569}.eyebrow{color:var(--teal);font-weight:800;text-transform:uppercase;letter-spacing:1.4px;font-size:12px}.hero-art{font-size:clamp(100px,20vw,190px);text-align:center;background:#fef3c7;border-radius:24px;padding:24px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-top:24px}.card{border:1px solid #dbeafe;border-radius:16px;padding:18px;background:#f8fafc}.card .emoji{font-size:30px}.card h3{margin:8px 0}.card p{line-height:1.5;color:#475569}.title{color:var(--navy);font-size:clamp(24px,4vw,32px);margin:0 0 12px}.sub{color:#475569;line-height:1.6}.fraction{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-size:1.15em;font-weight:800;line-height:1.2;margin:0 4px}.fraction span:first-child{border-bottom:2px solid currentColor;padding:0 7px 3px}.fraction span:last-child{padding:3px 7px 0}.workarea{background:#f0fdfa;border-radius:18px;padding:20px;margin:16px 0}.fraction-bars{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin:16px 0}.piece{width:54px;height:54px;border:2px solid #0f766e;border-radius:9px;background:white;display:grid;place-items:center;font-size:21px}.piece.filled{background:#14b8a6;color:white}.piece.second{background:#f59e0b;border-color:#b45309;color:#fff}.formula{font-size:clamp(24px,5vw,36px);font-weight:800;text-align:center;margin:16px 0;color:var(--navy)}.steps{display:grid;gap:10px}.step{background:#f8fafc;border-left:5px solid var(--teal);padding:13px 16px;border-radius:8px;line-height:1.5}.quiz-option{display:block;width:100%;text-align:left;margin:8px 0;background:white;border:2px solid #cbd5e1;box-shadow:none;color:var(--ink)}.quiz-option.selected{border-color:var(--teal);background:#ccfbf1}.feedback{padding:14px;border-radius:12px;margin-top:12px;line-height:1.5}.good{background:#dcfce7;color:#166534}.bad{background:#fff7ed;color:#92400e}.progress{height:9px;background:#e2e8f0;border-radius:99px;overflow:hidden}.progress div{height:100%;background:var(--teal);transition:width .2s}.small{font-size:13px;color:var(--muted)}footer{text-align:center;padding:20px;color:#64748b;font-size:13px}input[type=number],select{padding:10px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px;width:90px}label{font-weight:700}.badge{display:inline-block;background:#ccfbf1;color:#115e59;border-radius:99px;padding:6px 10px;font-size:12px;font-weight:800}@media(max-width:700px){.hero{grid-template-columns:1fr}.hero-art{font-size:100px;order:-1}.brand{align-items:flex-start}.piece{width:42px;height:42px}.panel{padding:18px}}
</style></head><body>
<header><div class="brand"><div class="logo">🍕</div><div><h1>Petualangan Menjumlahkan Pecahan</h1><p>Matematika Kelas V • SD Negeri 2 Pakue Utara</p></div></div><nav><button onclick="showScreen('home')">🏠 Beranda</button><button onclick="showScreen('materi')">📘 Materi</button><button onclick="showScreen('simulasi')">🧩 Simulasi</button><button onclick="showScreen('latihan')">✏️ Latihan</button><button onclick="startQuiz()">🏆 Evaluasi</button></nav></header>
<main id="app" aria-live="polite"></main><footer>Media Pembelajaran Interaktif • Kurikulum Merdeka Fase C • Dapat digunakan secara offline</footer>
<script>
const app=document.getElementById('app');let currentScreen='home',sim={a:1,b:2,d:4},practiceIndex=0,practiceAnswer=null,practiceChecked=false,quizIndex=0,quizAnswers=[],quizChecked=false;
const quiz=[
{q:'Hasil dari 2/7 + 3/7 adalah …',opts:['5/7','5/14','1/7'],correct:0,explain:'Penyebut sama, jadi pembilang dijumlahkan: 2 + 3 = 5. Hasilnya 5/7.'},
{q:'Hasil dari 1/2 + 1/4 adalah …',opts:['2/6','2/4','3/4'],correct:2,explain:'Samakan penyebut: 1/2 = 2/4. Jadi 2/4 + 1/4 = 3/4.'},
{q:'Ibu memakai 2/8 kg gula, lalu memakai lagi 3/8 kg. Berapa kg gula yang dipakai?',opts:['5/8 kg','5/16 kg','1/8 kg'],correct:0,explain:'Penyebutnya sama: 2/8 + 3/8 = 5/8 kg.'},
{q:'Pecahan senilai dengan 1/3 yang penyebutnya 6 adalah …',opts:['2/6','3/6','1/6'],correct:0,explain:'Kalikan pembilang dan penyebut 1/3 dengan 2 sehingga menjadi 2/6.'},
{q:'Hasil dari 3/10 + 4/10 adalah …',opts:['7/20','7/10','1/10'],correct:1,explain:'Penyebut tetap 10 dan pembilang dijumlahkan: 3 + 4 = 7.'},
{q:'Hasil dari 1/3 + 1/6 adalah …',opts:['2/9','1/2','2/6'],correct:1,explain:'1/3 = 2/6, maka 2/6 + 1/6 = 3/6 = 1/2.'},
{q:'Doni membaca 1/4 buku pada pagi hari dan 2/4 pada sore hari. Bagian buku yang dibaca adalah …',opts:['3/8','3/4','2/4'],correct:1,explain:'1/4 + 2/4 = 3/4 bagian buku.'},
{q:'Hasil dari 2/5 + 1/10 adalah …',opts:['3/15','5/10','1/2'],correct:2,explain:'2/5 = 4/10, jadi 4/10 + 1/10 = 5/10 = 1/2.'},
{q:'Untuk menjumlahkan 1/2 dan 1/3, langkah pertama yang tepat adalah …',opts:['Menjumlahkan penyebut menjadi 5','Menyamakan penyebut','Mengurangi pembilang'],correct:1,explain:'Penyebut berbeda, jadi ubah menjadi pecahan senilai dengan penyebut sama.'},
{q:'Hasil dari 1/4 + 2/4 dalam bentuk paling sederhana adalah …',opts:['3/4','3/8','1/2'],correct:0,explain:'1/4 + 2/4 = 3/4. Pecahan ini sudah paling sederhana.'}];
function frac(n,d){return `<span class="fraction"><span>${n}</span><span>${d}</span></span>`}function shell(c){app.innerHTML=`<section class="panel">${c}</section>`}
function showScreen(s){currentScreen=s;({home,materi,simulasi,latihan,hasil}[s]||home)();window.scrollTo(0,0)}
function home(){shell(`<div class="hero"><div><div class="eyebrow">Belajar sambil bermain</div><h2>Halo, Sahabat Pecahan! 👋</h2><p>Ayo belajar menjumlahkan pecahan dengan gambar, simulasi, latihan, dan kuis yang menyenangkan.</p><div class="row"><button class="primary" onclick="showScreen('materi')">Mulai Belajar →</button><button class="secondary" onclick="showScreen('simulasi')">Coba Simulasi</button></div><p class="small">Saran: pelajari materi terlebih dahulu sebelum mengerjakan evaluasi.</p></div><div class="hero-art">🍕<div style="font-size:22px;font-weight:800;color:#92400e">1/4 + 2/4 = 3/4</div></div></div><div class="cards"><div class="card"><div class="emoji">📘</div><h3>Materi</h3><p>Kenali cara menjumlahkan pecahan berpenyebut sama dan berbeda.</p><button onclick="showScreen('materi')">Buka Materi</button></div><div class="card"><div class="emoji">🧩</div><h3>Simulasi</h3><p>Ubah angka pecahan dan lihat model bagian yang digabungkan.</p><button onclick="showScreen('simulasi')">Mulai Simulasi</button></div><div class="card"><div class="emoji">🏆</div><h3>Evaluasi</h3><p>Kerjakan 10 soal untuk mengetahui pemahamanmu.</p><button onclick="startQuiz()">Mulai Evaluasi</button></div></div>`)}
function materi(){shell(`<div class="eyebrow">Bagian 1 • Pahami konsep</div><h2 class="title">Apa itu penjumlahan pecahan?</h2><p class="sub">Penjumlahan pecahan berarti menggabungkan dua atau lebih bagian. Bayangkan kamu memiliki potongan pizza, lalu mendapatkan potongan lagi.</p><div class="workarea"><h3>1. Penyebut sama</h3><p>Jika penyebutnya sama, jumlahkan pembilangnya. Penyebut tetap.</p><div class="formula">${frac(2,8)} + ${frac(3,8)} = ${frac(5,8)}</div><div class="fraction-bars">${Array.from({length:8},(_,i)=>`<div class="piece ${i<2?'filled':i<5?'second':''}">${i<5?'●':''}</div>`).join('')}</div><p class="small">Dua bagian hijau ditambah tiga bagian jingga menghasilkan lima dari delapan bagian.</p></div><div class="workarea"><h3>2. Penyebut berbeda</h3><p>Samakan penyebut terlebih dahulu dengan pecahan senilai, lalu jumlahkan pembilangnya.</p><div class="formula">${frac(1,2)} + ${frac(1,4)} = ${frac(2,4)} + ${frac(1,4)} = ${frac(3,4)}</div><div class="steps"><div class="step"><b>Langkah 1:</b> Penyebut 2 dan 4 berbeda.</div><div class="step"><b>Langkah 2:</b> Ubah 1/2 menjadi 2/4.</div><div class="step"><b>Langkah 3:</b> Jumlahkan 2/4 + 1/4 = 3/4.</div></div></div><div class="row"><button class="secondary" onclick="showScreen('home')">← Beranda</button><button class="primary" onclick="showScreen('simulasi')">Coba Simulasi →</button><button onclick="showScreen('latihan')">Latihan</button></div>`)}
function simulasi(){shell(`<div class="eyebrow">Bagian 2 • Eksplorasi</div><h2 class="title">Simulasi Penjumlahan Pecahan</h2><p class="sub">Pilih pembilang untuk dua pecahan. Simulasi ini menggunakan penyebut yang sama.</p><div class="workarea"><div class="row"><label>Pembilang pertama <input id="simA" type="number" min="0" max="8" value="${sim.a}" onchange="updateSim('a',this.value)"></label><label>Pembilang kedua <input id="simB" type="number" min="0" max="8" value="${sim.b}" onchange="updateSim('b',this.value)"></label><label>Penyebut <select id="simD" onchange="updateSim('d',this.value)">${[2,3,4,5,6,8].map(d=>`<option value="${d}" ${sim.d===d?'selected':''}>${d}</option>`).join('')}</select></label></div><p class="small">Untuk model satu keseluruhan, jumlah pembilang tidak boleh melebihi penyebut.</p><div class="formula">${frac(sim.a,sim.d)} + ${frac(sim.b,sim.d)} = ${frac(sim.a+sim.b,sim.d)}</div><div class="fraction-bars">${Array.from({length:sim.d},(_,i)=>`<div class="piece ${i<sim.a?'filled':i<sim.a+sim.b?'second':''}">${i<sim.a+sim.b?'●':''}</div>`).join('')}</div><div class="row"><span class="badge">Hijau: pecahan pertama</span><span class="badge" style="background:#fef3c7;color:#92400e">Jingga: pecahan kedua</span></div><div class="feedback ${sim.a+sim.b<=sim.d?'good':'bad'}">${sim.a+sim.b<=sim.d?`Hasilnya ${sim.a+sim.b}/${sim.d}. Gabungkan jumlah bagian yang diwarnai.`:'Jumlah bagian melebihi satu keseluruhan. Kurangi pembilang agar sesuai dengan model ini.'}</div></div><div class="row"><button class="secondary" onclick="showScreen('materi')">← Materi</button><button class="primary" onclick="showScreen('latihan')">Lanjut ke Latihan →</button></div>`)}
function updateSim(k,v){let n=parseInt(v,10);if(!Number.isFinite(n))n=0;if(k==='d'){sim.d=n;sim.a=Math.min(sim.a,n);sim.b=Math.min(sim.b,n-sim.a)}else{sim[k]=Math.max(0,Math.min(sim.d,n));if(sim.a+sim.b>sim.d){if(k==='a')sim.b=sim.d-sim.a;else sim.a=sim.d-sim.b}}simulasi()}
const practice=[{q:'2/9 + 4/9 = …',opts:['6/9','6/18','2/9'],correct:0,why:'Penyebut sama, jumlahkan 2 + 4 dan pertahankan penyebut 9.'},{q:'1/2 + 1/4 = …',opts:['2/6','3/4','2/4'],correct:1,why:'Ubah 1/2 menjadi 2/4, lalu 2/4 + 1/4 = 3/4.'},{q:'3/10 + 2/10 = …',opts:['5/20','1/10','5/10'],correct:2,why:'3/10 + 2/10 = 5/10, yang dapat disederhanakan menjadi 1/2.'}];
function latihan(){let q=practice[practiceIndex];shell(`<div class="eyebrow">Bagian 3 • Latihan terbimbing</div><h2 class="title">Ayo Berlatih!</h2><div class="progress"><div style="width:${(practiceIndex+1)/practice.length*100}%"></div></div><p class="small">Soal ${practiceIndex+1} dari ${practice.length}</p><h3>${q.q}</h3><div>${q.opts.map((o,i)=>`<button class="quiz-option ${practiceAnswer===i?'selected':''}" onclick="selectPractice(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}</div>${practiceChecked?`<div class="feedback ${practiceAnswer===q.correct?'good':'bad'}"><b>${practiceAnswer===q.correct?'Hebat, jawabanmu benar!':'Belum tepat, coba pahami langkahnya.'}</b><br>${q.why}</div>`:''}<div class="row" style="margin-top:16px"><button class="secondary" onclick="showScreen('simulasi')">← Simulasi</button>${!practiceChecked?`<button class="primary" onclick="checkPractice()" ${practiceAnswer===null?'disabled':''}>Periksa Jawaban</button>`:`<button class="primary" onclick="nextPractice()">${practiceIndex<practice.length-1?'Soal Berikutnya →':'Selesai Latihan →'}</button>`}</div>`)}
function selectPractice(i){practiceAnswer=i;practiceChecked=false;latihan()}function checkPractice(){if(practiceAnswer!==null){practiceChecked=true;latihan()}}function nextPractice(){if(practiceIndex<practice.length-1){practiceIndex++;practiceAnswer=null;practiceChecked=false;latihan()}else{practiceIndex=0;practiceAnswer=null;practiceChecked=false;startQuiz()}}
function startQuiz(){quizIndex=0;quizAnswers=Array(quiz.length).fill(null);quizChecked=false;showQuiz()}function showQuiz(){currentScreen='evaluasi';let q=quiz[quizIndex];shell(`<div class="eyebrow">Bagian 4 • Evaluasi akhir</div><h2 class="title">Kuis Penjumlahan Pecahan 🏆</h2><div class="row" style="justify-content:space-between"><span class="small">Soal ${quizIndex+1} dari ${quiz.length}</span><span class="badge">${quizAnswers.filter(x=>x!==null).length} dijawab</span></div><div class="progress" style="margin:12px 0 20px"><div style="width:${(quizIndex+1)/quiz.length*100}%"></div></div><h3>${q.q}</h3><div>${q.opts.map((o,i)=>`<button class="quiz-option ${quizAnswers[quizIndex]===i?'selected':''}" onclick="chooseQuiz(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}</div>${quizChecked?`<div class="feedback ${quizAnswers[quizIndex]===q.correct?'good':'bad'}"><b>${quizAnswers[quizIndex]===q.correct?'Benar!':'Mari pelajari lagi.'}</b><br>${q.explain}</div>`:''}<div class="row" style="margin-top:18px">${quizIndex>0?`<button class="secondary" onclick="quizPrev()">← Sebelumnya</button>`:''}${!quizChecked?`<button class="primary" onclick="checkQuiz()" ${quizAnswers[quizIndex]===null?'disabled':''}>Periksa Jawaban</button>`:quizIndex<quiz.length-1?`<button class="primary" onclick="quizNext()">Soal Berikutnya →</button>`:`<button class="primary" onclick="finishQuiz()">Lihat Hasil</button>`}</div><p class="small">Jawaban diperiksa satu per satu agar kamu dapat belajar dari pembahasannya.</p>`)}function chooseQuiz(i){quizAnswers[quizIndex]=i;quizChecked=false;showQuiz()}function checkQuiz(){if(quizAnswers[quizIndex]!==null){quizChecked=true;showQuiz()}}function quizPrev(){quizIndex--;quizChecked=false;showQuiz()}function quizNext(){quizIndex++;quizChecked=false;showQuiz()}function finishQuiz(){showScreen('hasil')}
function hasil(){let correct=quiz.reduce((n,q,i)=>n+(quizAnswers[i]===q.correct?1:0),0),score=correct*10;shell(`<div style="text-align:center"><div style="font-size:76px">${score>=70?'🏆':'🌱'}</div><div class="eyebrow">Evaluasi selesai</div><h2 class="title">Hasil Belajarmu</h2><div style="font-size:64px;font-weight:900;color:var(--teal)">${score}</div><p class="sub">Nilai: ${correct} dari ${quiz.length} jawaban benar.</p><div class="feedback ${score>=70?'good':'bad'}">${score>=70?'Hebat! Terus pertahankan semangat belajarmu.':'Tetap semangat! Pelajari kembali materi dan coba evaluasi lagi.'}<br>Ambang contoh 70 dapat disesuaikan oleh guru sesuai kriteria sekolah.</div></div><h3>Pembahasan ringkas</h3><div class="steps">${quiz.map((q,i)=>`<div class="step"><b>Soal ${i+1}:</b> ${q.explain}<br><span class="small">Jawabanmu: ${quizAnswers[i]===null?'Belum dijawab':q.opts[quizAnswers[i]]} • Jawaban benar: ${q.opts[q.correct]}</span></div>`).join('')}</div><div class="row" style="margin-top:20px"><button class="primary" onclick="startQuiz()">Ulangi Evaluasi</button><button class="secondary" onclick="showScreen('materi')">Pelajari Materi Lagi</button><button onclick="showScreen('home')">Kembali ke Beranda</button></div>`)}home();
</script></body></html>
